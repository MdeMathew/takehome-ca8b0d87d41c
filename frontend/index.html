<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Reservas · Workfactory</title>
  <script>
    try {
      const saved = localStorage.getItem("booking-theme");
      document.documentElement.dataset.theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    } catch (_) {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light;
      --canvas: #f5f7fb; --surface: #fff; --soft: #f8fafc; --hover: #f2f6fc;
      --text: #182239; --muted: #68758b; --subtle: #91a0b3; --line: #e7ecf3;
      --accent: #4263e9; --accent-soft: #edf1ff;
      --green: #138a63; --green-soft: #e8f8f1;
      --amber: #ab7013; --amber-soft: #fff6e5;
      --red: #c94753; --red-soft: #fff0f1;
      --shadow: 0 10px 32px rgba(27,48,83,.045);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --canvas: #0e1421; --surface: #172132; --soft: #1b293c; --hover: #223249;
      --text: #ecf2fb; --muted: #a4b1c5; --subtle: #8292aa; --line: #2b3a50;
      --accent: #9aabff; --accent-soft: #283667;
      --green: #66d6a9; --green-soft: #183e3a;
      --amber: #f5c674; --amber-soft: #493b28;
      --red: #ff8f99; --red-soft: #4d303c;
      --shadow: 0 16px 42px rgba(0,0,0,.13);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--canvas); color: var(--text); font: 14px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .app { display: flex; min-height: 100vh; }
    .sidebar { width: 244px; flex: 0 0 244px; display: flex; flex-direction: column; padding: 29px 16px 20px; background: var(--surface); border-right: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 12px; text-decoration: none; font-size: 18px; font-weight: 750; letter-spacing: -.05em; }
    .brand-mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 11px; background: #4263e9; color: #fff; font-size: 20px; box-shadow: 0 5px 12px rgba(66,99,233,.22); }
    .nav-label { padding: 39px 15px 11px; color: var(--subtle); font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .nav-link { display: flex; align-items: center; gap: 11px; padding: 11px 13px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); text-decoration: none; font-weight: 650; }
    .nav-link svg, .btn svg, .search svg, .stat-icon svg { width: 18px; height: 18px; flex: none; }
    .side-foot { margin-top: auto; padding: 18px 12px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .side-foot strong { display: block; margin-bottom: 7px; color: var(--text); }
    .side-foot p { margin: 0; }
    .workspace { min-width: 0; flex: 1; }
    .topbar { height: 78px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 clamp(22px,4.2vw,64px); background: var(--surface); border-bottom: 1px solid var(--line); }
    .breadcrumb { color: var(--muted); font-size: 13px; }
    .breadcrumb b { margin-left: 11px; color: var(--text); font-weight: 650; }
    .breadcrumb b::before { content: "/"; margin-right: 11px; color: var(--subtle); }
    .top-actions { display: flex; align-items: center; gap: 16px; }
    .live { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; font-weight: 600; }
    .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
    .theme-button { display: inline-flex; align-items: center; gap: 9px; min-height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--text); font-size: 12px; font-weight: 650; }
    .theme-button:hover, .btn.secondary:hover { background: var(--hover); }
    .theme-button svg { width: 17px; height: 17px; }
    .main { max-width: 1510px; margin: 0 auto; padding: 38px clamp(22px,4.2vw,64px) 70px; }
    .eyebrow { margin: 0 0 5px; color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(25px,2.4vw,34px); line-height: 1.23; letter-spacing: -.045em; }
    h2 { margin: 0; font-size: 17px; letter-spacing: -.025em; }
    .intro { margin: 10px 0 0; color: var(--muted); }
    .page-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 29px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 37px; padding: 8px 14px; border: 1px solid transparent; border-radius: 9px; text-decoration: none; font-weight: 650; white-space: nowrap; }
    .btn.primary { color: #fff; background: #4263e9; }
    .btn.primary:hover { background: #304ed1; }
    .btn.secondary { color: var(--text); background: var(--surface); border-color: var(--line); }
    .btn:disabled { opacity: .65; cursor: wait; }
    .summary { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 16px; margin-bottom: 27px; }
    .stat, .panel { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
    .stat { min-height: 132px; padding: 21px 22px; }
    .stat-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .stat-icon { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); }
    .stat-icon.green { background: var(--green-soft); color: var(--green); }
    .stat-icon.amber { background: var(--amber-soft); color: var(--amber); }
    .stat-icon.red { background: var(--red-soft); color: var(--red); }
    .stat-value { margin: 10px 0 0; font-size: 30px; line-height: 1; font-weight: 760; letter-spacing: -.06em; font-variant-numeric: tabular-nums; }
    .panel { overflow: hidden; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 22px 23px 18px; }
    .panel-subtitle { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .search { position: relative; display: flex; align-items: center; color: var(--subtle); }
    .search svg { position: absolute; left: 12px; }
    .search input { width: min(280px,29vw); min-height: 37px; padding: 8px 12px 8px 37px; border: 1px solid var(--line); border-radius: 9px; color: var(--text); background: var(--soft); }
    .search input::placeholder { color: var(--subtle); }
    .filters { display: flex; gap: 4px; padding: 0 23px; border-bottom: 1px solid var(--line); overflow-x: auto; }
    .filter { position: relative; flex: none; padding: 11px 14px 13px; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 650; }
    .filter:hover { color: var(--text); }
    .filter.active { color: var(--accent); }
    .filter.active::after { content: ""; position: absolute; bottom: -1px; left: 10px; right: 10px; height: 2px; border-radius: 2px; background: var(--accent); }
    .table-scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; min-width: 800px; }
    th { padding: 13px 18px; text-align: left; background: var(--soft); color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .075em; text-transform: uppercase; white-space: nowrap; }
    th:first-child, td:first-child { padding-left: 23px; }
    th:last-child, td:last-child { padding-right: 23px; }
    td { padding: 16px 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; vertical-align: middle; white-space: nowrap; }
    tbody tr:hover { background: var(--hover); }
    td strong { display: block; color: var(--text); font-size: 13px; font-weight: 680; }
    td small { display: block; margin-top: 2px; color: var(--subtle); font-size: 11px; }
    .row-link { color: var(--text); text-decoration: none; font-weight: 680; }
    .row-link:hover { color: var(--accent); }
    .channel { display: inline-flex; align-items: center; gap: 8px; color: var(--text); font-weight: 600; }
    .channel-mark { display: grid; place-items: center; width: 25px; height: 25px; border-radius: 7px; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 850; }
    .channel-mark.airbnb { background: var(--red-soft); color: var(--red); }
    .status { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 6px; font-size: 11px; font-weight: 750; white-space: nowrap; }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status.synced { background: var(--green-soft); color: var(--green); }
    .status.failed { background: var(--red-soft); color: var(--red); }
    .status.retrying { background: var(--amber-soft); color: var(--amber); }
    .status.syncing { background: var(--accent-soft); color: var(--accent); }
    .status.pending { background: var(--hover); color: var(--muted); }
    .arrow { color: var(--subtle); font-size: 18px; }
    .panel-foot { display: flex; justify-content: space-between; gap: 10px; padding: 13px 23px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .empty { display: grid; justify-items: center; gap: 9px; padding: 70px 24px; text-align: center; color: var(--muted); }
    .empty svg { width: 26px; height: 26px; color: var(--accent); }
    .empty strong { color: var(--text); font-size: 14px; }
    .empty p { max-width: 360px; margin: 0; font-size: 12px; }
    .back { display: inline-block; margin-bottom: 22px; color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 650; }
    .back:hover { color: var(--accent); }
    .detail-title { display: flex; align-items: center; flex-wrap: wrap; gap: 15px; }
    .detail-grid { display: grid; grid-template-columns: minmax(0,1.5fr) minmax(270px,1fr); gap: 20px; margin-top: 28px; }
    .detail-card { padding: 24px; }
    .detail-card h2 { padding-bottom: 17px; border-bottom: 1px solid var(--line); }
    .detail-fields { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 23px 20px; margin-top: 23px; }
    .field-label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 11px; font-weight: 650; }
    .field-value { display: block; color: var(--text); font-size: 13px; font-weight: 650; overflow-wrap: anywhere; }
    .detail-side .field { margin-top: 22px; }
    .detail-side .field:first-of-type { margin-top: 23px; }
    .error-box { padding: 12px 14px; border-radius: 9px; background: var(--red-soft); color: var(--red); font-size: 12px; overflow-wrap: anywhere; }
    .detail-actions { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
    .detail-actions .btn { width: 100%; }
    .hint { margin: 10px 0 0; color: var(--muted); font-size: 11px; }
    .notice { margin: 0 0 20px; padding: 12px 15px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--text); font-size: 12px; }
    .notice.error { border-color: var(--red); color: var(--red); }
    .loading { padding: 70px 0; color: var(--muted); text-align: center; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 1050px) { .sidebar { width: 200px; flex-basis: 200px; } .summary { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 720px) {
      .app { display: block; }
      .sidebar { width: 100%; height: 61px; padding: 0 20px; flex-direction: row; align-items: center; justify-content: space-between; border-right: 0; border-bottom: 1px solid var(--line); }
      .brand { padding: 0; } .brand-mark { width: 31px; height: 31px; font-size: 17px; }
      .nav-label, .side-foot { display: none; }
      .nav-link { padding: 8px 10px; font-size: 12px; }
      .topbar { height: 57px; padding: 0 20px; }
      .main { padding: 27px 20px 50px; }
      .detail-grid { grid-template-columns: 1fr; }
      .panel-head { align-items: stretch; flex-direction: column; }
      .search input { width: 100%; }
    }
    @media (max-width: 480px) {
      .summary { gap: 9px; } .stat { padding: 15px; min-height: 110px; } .stat-value { font-size: 26px; }
      .live, .breadcrumb b::before, .theme-button span { display: none; }
      .page-heading { align-items: start; flex-direction: column; }
      .detail-fields { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Navegación principal">
      <a class="brand" href="/" aria-label="Workfactory, inicio"><span class="brand-mark">w.</span><span>workfactory</span></a>
      <div class="nav-label">Espacio de trabajo</div>
      <a class="nav-link" href="/" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4m8-4v4M3 10h18M8 14h3m-3 4h3"/></svg>
        Reservas
      </a>
      <div class="side-foot"><strong>Sincronización de canales</strong><p>Reservas de Booking y Airbnb hacia tu PMS.</p></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb">Espacio de trabajo <b>Reservas</b></div>
        <div class="top-actions"><span class="live">Actualiza cada 5 s</span><button id="themeToggle" class="theme-button" type="button" aria-label="Cambiar tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg><span id="themeLabel">Modo oscuro</span></button></div>
      </header>
      <main id="out" class="main"><div class="loading">Cargando reservas…</div></main>
    </div>
  </div>
  <script>
    const out = document.getElementById("out");
    const themeToggle = document.getElementById("themeToggle");
    const themeLabel = document.getElementById("themeLabel");
    const icons = {
      refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9A7 7 0 0 1 18.4 7M18.4 15A7 7 0 0 1 5.6 17"/></svg>',
      stack: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>',
      check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg>',
      clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
      alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 4h.01"/></svg>',
      search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>'
    };
    const labels = { pending: "Pendiente", syncing: "Sincronizando", synced: "Sincronizada", retrying: "Reintentando", failed: "Fallida" };
    let bookings = [];
    let filter = "all";
    let query = "";
    let retrying = false;
    let lastPayload = "";

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[character]);
    }
    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      themeLabel.textContent = theme === "dark" ? "Modo claro" : "Modo oscuro";
      themeToggle.setAttribute("aria-label", theme === "dark" ? "Activar modo claro" : "Activar modo oscuro");
      themeToggle.setAttribute("aria-pressed", String(theme === "dark"));
      try { localStorage.setItem("booking-theme", theme); } catch (_) {}
    }
    setTheme(document.documentElement.dataset.theme);
    themeToggle.addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
    async function ask(path, options = {}) {
      const response = await fetch(path, options);
      const body = await response.json().catch(() => null);
      if (!response.ok) throw new Error((body?.error?.code ?? response.status) + ": " + (body?.error?.message ?? "No se pudo completar la solicitud."));
      return body;
    }
    function money(value, currency) {
      const amount = Number(value);
      if (!Number.isFinite(amount)) return "—";
      try { return new Intl.NumberFormat("es-ES", { style: "currency", currency: currency || "EUR" }).format(amount); }
      catch (_) { return amount.toLocaleString("es-ES") + " " + (currency || ""); }
    }
    function date(value) {
      if (!value) return "—";
      const parsed = new Date(value);
      if (Number.isNaN(parsed.getTime())) return escapeHtml(value);
      return new Intl.DateTimeFormat("es-ES", { day: "2-digit", month: "short", year: "numeric", timeZone: "UTC" }).format(parsed);
    }
    function dateTime(value) {
      if (!value) return "—";
      const parsed = new Date(value);
      if (Number.isNaN(parsed.getTime())) return escapeHtml(value);
      return new Intl.DateTimeFormat("es-ES", { dateStyle: "medium", timeStyle: "short" }).format(parsed);
    }
    function status(booking) {
      const key = labels[booking.status] ? booking.status : "pending";
      return '<span class="status ' + key + '">' + labels[key] + '</span>';
    }
    function channel(booking) {
      const name = String(booking.channel ?? "—");
      const airbnb = name.toLowerCase() === "airbnb";
      return '<span class="channel"><span class="channel-mark ' + (airbnb ? "airbnb" : "") + '">' + (airbnb ? "A" : "B") + '</span>' + escapeHtml(name) + '</span>';
    }
    function stat(label, value, icon, tone) {
      return '<article class="stat"><div class="stat-top"><span>' + label + '</span><span class="stat-icon ' + tone + '">' + icons[icon] + '</span></div><p class="stat-value">' + value + '</p></article>';
    }
    function filteredBookings() {
      return bookings.filter(booking => {
        const matchesStatus = filter === "all" || booking.status === filter;
        const needle = String(booking.id ?? "") + " " + String(booking.guestName ?? "") + " " + String(booking.channel ?? "");
        return matchesStatus && needle.toLocaleLowerCase("es").includes(query.toLocaleLowerCase("es"));
      });
    }
    function renderRows() {
      const rows = filteredBookings();
      const target = document.getElementById("bookingRows");
      if (!target) return;
      if (!rows.length) {
        target.innerHTML = '<div class="empty">' + icons.search + '<strong>' + (bookings.length ? "No hay coincidencias" : "Todavía no hay reservas") + '</strong><p>' + (bookings.length ? "Prueba otra búsqueda o selecciona un estado distinto." : "Las reservas aparecerán aquí cuando lleguen eventos de los canales.") + '</p></div>';
      } else {
        target.innerHTML = '<div class="table-scroll"><table><thead><tr><th>Reserva / huésped</th><th>Canal</th><th>Estancia</th><th>Importe</th><th>Estado</th><th>Actualizada</th><th><span class="sr-only">Abrir</span></th></tr></thead><tbody>' +
          rows.map(booking => {
            const href = "?booking=" + encodeURIComponent(booking.id ?? "");
            return '<tr><td><a class="row-link" href="' + href + '">' + escapeHtml(booking.guestName || "Sin nombre") + '</a><small>' + escapeHtml(booking.id) + '</small></td><td>' + channel(booking) + '</td><td><strong>' + date(booking.checkIn) + ' – ' + date(booking.checkOut) + '</strong></td><td><strong>' + escapeHtml(money(booking.totalPrice, booking.currency)) + '</strong></td><td>' + status(booking) + '</td><td>' + dateTime(booking.updatedAt) + '</td><td><a class="row-link arrow" href="' + href + '" aria-label="Ver reserva ' + escapeHtml(booking.id) + '">→</a></td></tr>';
          }).join("") + '</tbody></table></div>';
      }
      document.getElementById("resultCount").textContent = rows.length + " de " + bookings.length + " reservas";
    }
    function renderList(items) {
      bookings = Array.isArray(items) ? items : [];
      const synced = bookings.filter(item => item.status === "synced").length;
      const failed = bookings.filter(item => item.status === "failed").length;
      const active = bookings.filter(item => ["pending", "syncing", "retrying"].includes(item.status)).length;
      out.innerHTML = '<div class="page-heading"><div><p class="eyebrow">Panel de operaciones</p><h1>Reservas</h1><p class="intro">Sigue la sincronización de Booking y Airbnb con el PMS.</p></div><button id="refreshButton" class="btn secondary" type="button">' + icons.refresh + ' Actualizar</button></div>' +
        '<section class="summary" aria-label="Resumen">' + stat("Reservas totales", bookings.length, "stack", "") + stat("Sincronizadas", synced, "check", "green") + stat("En proceso", active, "clock", "amber") + stat("Fallidas", failed, "alert", "red") + '</section>' +
        '<section class="panel" aria-label="Listado de reservas"><div class="panel-head"><div><h2>Todas las reservas</h2><p class="panel-subtitle">Estado y actividad de cada reserva</p></div><label class="search">' + icons.search + '<input id="bookingSearch" type="search" placeholder="Buscar reserva o huésped" aria-label="Buscar reserva o huésped" value="' + escapeHtml(query) + '"></label></div>' +
        '<div class="filters" role="group" aria-label="Filtrar por estado">' + [["all","Todas"],["synced","Sincronizadas"],["pending","Pendientes"],["syncing","Sincronizando"],["retrying","Reintentando"],["failed","Fallidas"]].map(([key,label]) => '<button class="filter ' + (filter === key ? "active" : "") + '" type="button" data-filter="' + key + '" aria-pressed="' + (filter === key) + '">' + label + '</button>').join("") + '</div>' +
        '<div id="bookingRows"></div><div class="panel-foot"><span id="resultCount"></span><span>Ordenadas por última actualización</span></div></section>';
      renderRows();
      document.getElementById("bookingSearch").addEventListener("input", event => { query = event.target.value; renderRows(); });
      document.querySelectorAll("[data-filter]").forEach(button => button.addEventListener("click", () => {
        filter = button.dataset.filter;
        document.querySelectorAll("[data-filter]").forEach(tab => { tab.classList.toggle("active", tab === button); tab.setAttribute("aria-pressed", String(tab === button)); });
        renderRows();
      }));
      document.getElementById("refreshButton").addEventListener("click", load);
    }
    function field(label, value) {
      return '<div class="field"><span class="field-label">' + label + '</span><span class="field-value">' + value + '</span></div>';
    }
    function renderDetail(booking, notice = "") {
      const failed = booking.status === "failed";
      out.innerHTML = (notice ? '<div class="notice" role="status">' + escapeHtml(notice) + '</div>' : "") +
        '<a class="back" href="/">← Volver a reservas</a><div class="page-heading"><div><p class="eyebrow">Detalle de reserva</p><div class="detail-title"><h1>' + escapeHtml(booking.id) + '</h1>' + status(booking) + '</div><p class="intro">Consulta la información y el progreso de sincronización.</p></div><button id="refreshButton" class="btn secondary" type="button">' + icons.refresh + ' Actualizar</button></div>' +
        '<div class="detail-grid"><section class="panel detail-card"><h2>Información de la reserva</h2><div class="detail-fields">' +
        field("Huésped", escapeHtml(booking.guestName || "—")) + field("Canal", channel(booking)) +
        field("Entrada", date(booking.checkIn)) + field("Salida", date(booking.checkOut)) +
        field("Importe total", escapeHtml(money(booking.totalPrice, booking.currency))) + field("Moneda", escapeHtml(booking.currency || "—")) +
        '</div></section><section class="panel detail-card detail-side"><h2>Sincronización con PMS</h2>' +
        field("Estado actual", status(booking)) + field("Intentos realizados", escapeHtml(booking.attempts ?? 0)) +
        field("Referencia PMS", escapeHtml(booking.pmsReference || "—")) + field("Última actualización", dateTime(booking.updatedAt)) +
        (booking.lastError ? '<div class="field"><span class="field-label">Último error</span><div class="error-box">' + escapeHtml(booking.lastError) + '</div></div>' : "") +
        (failed ? '<div class="detail-actions"><button id="retryButton" class="btn primary" type="button">' + icons.refresh + ' Forzar sincronización</button><p class="hint">Se enviará de nuevo esta reserva al PMS.</p></div>' : "") + '</section></div>';
      document.getElementById("refreshButton").addEventListener("click", load);
      document.getElementById("retryButton")?.addEventListener("click", () => retry(booking.id));
    }
    async function retry(id) {
      if (retrying) return;
      retrying = true;
      const button = document.getElementById("retryButton");
      if (button) { button.disabled = true; button.textContent = "Reintentando…"; }
      try {
        await ask("/api/bookings/" + encodeURIComponent(id) + "/retry", { method: "POST" });
        renderDetail(await ask("/api/bookings/" + encodeURIComponent(id)), "Sincronización solicitada. El estado se actualizará automáticamente.");
      } catch (error) {
        showError(error);
      } finally {
        retrying = false;
        if (button?.isConnected) { button.disabled = false; button.innerHTML = icons.refresh + " Forzar sincronización"; }
      }
    }
    function showError(error) {
      out.querySelectorAll(".notice.error").forEach(notice => notice.remove());
      const notice = document.createElement("div");
      notice.className = "notice error";
      notice.setAttribute("role", "alert");
      notice.textContent = error.message ?? String(error);
      out.prepend(notice);
    }
    async function load() {
      const wanted = new URLSearchParams(location.search).get("booking");
      const button = document.getElementById("refreshButton");
      if (button) button.disabled = true;
      else out.innerHTML = '<div class="loading">Cargando reservas…</div>';
      try {
        const data = wanted ? await ask("/api/bookings/" + encodeURIComponent(wanted)) : (await ask("/api/bookings")).items ?? [];
        const payload = JSON.stringify(data);
        if (payload === lastPayload && button && !out.querySelector(".notice.error")) {
          button.disabled = false;
          return;
        }
        lastPayload = payload;
        if (wanted) renderDetail(data);
        else renderList(data);
      } catch (error) {
        if (button) { button.disabled = false; showError(error); }
        else {
          out.innerHTML = '<button id="tryAgain" class="btn secondary" type="button">Volver a intentar</button>';
          showError(error);
          document.getElementById("tryAgain").addEventListener("click", load);
        }
      }
    }
    load();
    setInterval(() => {
      if (document.hidden || retrying || document.activeElement?.id === "bookingSearch") return;
      load();
    }, 5000);
  </script>
</body>
</html>
